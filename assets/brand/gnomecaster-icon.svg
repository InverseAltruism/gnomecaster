<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A tinker's pointed hat with brass goggles on its band, on a riveted iron plate.
       Read at 16 px as a red cone with two lit lenses; the cog, rivets and stitching only
       show from about 48 px. tools/make_icons.py renders every size from this file. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3B4855"/>
      <stop offset="0.55" stop-color="#25303A"/>
      <stop offset="1" stop-color="#161D24"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D58C"/>
      <stop offset="0.45" stop-color="#C9963F"/>
      <stop offset="1" stop-color="#7A531C"/>
    </linearGradient>
    <linearGradient id="cloth" gradientUnits="userSpaceOnUse" x1="70" y1="60" x2="190" y2="170">
      <stop offset="0" stop-color="#E0604A"/>
      <stop offset="0.5" stop-color="#B53A2B"/>
      <stop offset="1" stop-color="#7C2219"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9E2E22"/>
      <stop offset="1" stop-color="#5E1812"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFE7A6"/>
      <stop offset="0.5" stop-color="#D9A548"/>
      <stop offset="1" stop-color="#8A5D1E"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#F4FFFF"/>
      <stop offset="0.3" stop-color="#8CEBFF"/>
      <stop offset="0.75" stop-color="#2C9CCB"/>
      <stop offset="1" stop-color="#14516F"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FF1FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FF1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFE6A3"/>
      <stop offset="0.6" stop-color="#B8853A"/>
      <stop offset="1" stop-color="#5C3F14"/>
    </radialGradient>
  </defs>

  <!-- plate and brass bezel -->
  <rect x="6" y="6" width="244" height="244" rx="46" fill="url(#bezel)"/>
  <rect x="16" y="16" width="224" height="224" rx="37" fill="url(#plate)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="36.5" fill="none" stroke="#0C1116" stroke-opacity="0.7" stroke-width="3"/>
  <g fill="url(#rivet)">
    <circle cx="40" cy="40" r="6"/>
    <circle cx="216" cy="40" r="6"/>
    <circle cx="40" cy="216" r="6"/>
    <circle cx="216" cy="216" r="6"/>
  </g>

  <!-- the engraved cog behind the hat -->
  <g fill="none" stroke="#4E5D6B" stroke-opacity="0.75">
    <path stroke-width="5" stroke-linejoin="round" d="M116.3 46.8 L118.1 34.5 L137.9 34.5 L139.7 46.8 L154.4 50.2 L161.4 39.9 L179.2 48.4 L175.5 60.3 L187.3 69.7 L198.1 63.5 L210.4 78.9 L201.9 88.0 L208.5 101.6 L220.9 100.7 L225.3 119.9 L213.7 124.4 L213.7 139.6 L225.3 144.1 L220.9 163.3 L208.5 162.4 L201.9 176.0 L210.4 185.1 L198.1 200.5 L187.3 194.3 L175.5 203.7 L179.2 215.6 L161.4 224.1 L154.4 213.8 L139.7 217.2 L137.9 229.5 L118.1 229.5 L116.3 217.2 L101.6 213.8 L94.6 224.1 L76.8 215.6 L80.5 203.7 L68.7 194.3 L57.9 200.5 L45.6 185.1 L54.1 176.0 L47.5 162.4 L35.1 163.3 L30.7 144.1 L42.3 139.6 L42.3 124.4 L30.7 119.9 L35.1 100.7 L47.5 101.6 L54.1 88.0 L45.6 78.9 L57.9 63.5 L68.7 69.7 L80.5 60.3 L76.8 48.4 L94.6 39.9 L101.6 50.2 Z"/>
    <circle cx="128" cy="132" r="64" stroke-width="4" stroke-dasharray="3 9"/>
  </g>

  <!-- shadow under the hat -->
  <ellipse cx="128" cy="204" rx="86" ry="14" fill="#06090C" fill-opacity="0.55"/>

  <!-- the cone: rises, leans right, tip folds over -->
  <path d="M60 192 C 78 150, 96 106, 118 70 C 130 50, 150 34, 174 32 C 188 31, 196 42, 190 52 C 178 46, 164 52, 160 66 C 166 108, 180 152, 196 192 Z" fill="url(#cloth)"/>
  <path d="M92 158 C 100 124, 112 96, 128 72" fill="none" stroke="#FFB3A0" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- stitched seam -->
  <path d="M146 64 C 152 104, 162 140, 174 172" fill="none" stroke="#5E1812" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- brim -->
  <ellipse cx="128" cy="194" rx="82" ry="17" fill="url(#brim)"/>
  <path d="M50 192 C 80 202, 176 202, 206 192" fill="none" stroke="#E0604A" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- goggle strap -->
  <path d="M70 152 C 104 162, 152 162, 188 152 L 192 170 C 152 180, 104 180, 66 170 Z" fill="#3A2618"/>
  <path d="M70 152 C 104 162, 152 162, 188 152" fill="none" stroke="#6E4A2E" stroke-width="2.5"/>

  <!-- goggles: two brass-rimmed lenses, the left rim toothed like a cog -->
  <circle cx="102" cy="150" r="40" fill="url(#glow)"/>
  <circle cx="156" cy="150" r="40" fill="url(#glow)"/>
  <rect x="118" y="144" width="22" height="11" rx="3" fill="url(#rim)"/>
  <g fill="url(#rim)">
    <path d="M96.7 125.6 L97.3 120.4 L106.7 120.4 L107.3 125.6 L112.1 127.1 L115.6 123.3 L123.2 128.8 L120.6 133.3 L123.6 137.4 L128.7 136.4 L131.6 145.3 L126.9 147.5 L126.9 152.5 L131.6 154.7 L128.7 163.6 L123.6 162.6 L120.6 166.7 L123.2 171.2 L115.6 176.7 L112.1 172.9 L107.3 174.4 L106.7 179.6 L97.3 179.6 L96.7 174.4 L91.9 172.9 L88.4 176.7 L80.8 171.2 L83.4 166.7 L80.4 162.6 L75.3 163.6 L72.4 154.7 L77.1 152.5 L77.1 147.5 L72.4 145.3 L75.3 136.4 L80.4 137.4 L83.4 133.3 L80.8 128.8 L88.4 123.3 L91.9 127.1 Z"/>
    <circle cx="156" cy="150" r="27"/>
  </g>
  <circle cx="102" cy="150" r="19" fill="url(#lens)"/>
  <circle cx="156" cy="150" r="19" fill="url(#lens)"/>
  <path d="M91 143 a 12 12 0 0 1 9 -7" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M145 143 a 12 12 0 0 1 9 -7" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round"/>

  <!-- a spark at the folded tip -->
  <circle cx="192" cy="54" r="18" fill="url(#glow)"/>
  <path d="M192 40 L195.5 50.5 L206 54 L195.5 57.5 L192 68 L188.5 57.5 L178 54 L188.5 50.5 Z" fill="#F2FEFF"/>
</svg>
